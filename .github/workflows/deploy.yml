name: deploy
on:
  push:
    branches: [express]
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code in deployment directory
        run: |
          cd /opt/moftaked/api
          git stash --include-untracked
          git pull origin express
          git stash pop || true
      - name: Rebuild and restart API container
        run: |
          docker compose -f /opt/moftaked/docker/docker-compose.prod.yml up -d --build api
      - name: Pull latest client code
        run: |
          cd /opt/moftaked/client-web
          git config --global --add safe.directory /opt/moftaked/client-web
          git stash --include-untracked
          git pull origin react-rewrite
          git stash pop || true
      - name: Rebuild and restart client container
        run: |
          docker compose -f /opt/moftaked/docker/docker-compose.prod.yml up -d --build client
